# Avviso: cyberpunk2077.lol non mostra più "Coming Soon".
# Ogni 30 minuti controlla la pagina. Se risponde 200 e la scritta non c'è più, il giro FALLISCE (GitHub manda una mail
# al proprietario del repository) e il controllo si disattiva da solo, così l'avviso arriva una volta sola.
name: Avviso cyberpunk2077.lol
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Controlla la pagina
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -m 30 -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36" -o page.html -w "%{http_code}" https://cyberpunk2077.lol/ || echo 000)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "Sito non raggiungibile adesso: riprovo al prossimo giro."; exit 0; fi
          if grep -qi "coming soon" page.html; then echo "Ancora 'Coming Soon'."; exit 0; fi
          echo "::error title=cyberpunk2077.lol è cambiato::La pagina non mostra più 'Coming Soon'. Controllala: https://cyberpunk2077.lol/"
          head -c 800 page.html
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/avviso-cyberpunk.yml/disable" || true
          exit 1
